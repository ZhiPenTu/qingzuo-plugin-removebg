<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI 抠图 · 轻作</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="tool-page">
  <header class="page-head">
    <div>
      <h1>AI 抠图</h1>
      <p>为商品图片生成透明背景，并使用你自己的 remove.bg 额度。</p>
    </div>
    <a href="https://www.remove.bg/dashboard#api-key" target="_blank" rel="noopener noreferrer" class="link-btn">获取 API Key ↗</a>
  </header>

  <section class="card settings">
    <div class="credential-row">
      <label for="key">remove.bg API 密钥</label>
      <div class="row">
        <input type="password" id="key" autocomplete="off" placeholder="输入密钥，安全保存在系统凭据库">
        <button id="save-key" type="button">保存密钥</button>
        <button id="clear-key" class="secondary" type="button">删除密钥</button>
      </div>
      <p id="key-status" role="status"></p>
    </div>
  </section>

  <section class="card workbar">
    <div class="actions">
      <button id="pick" type="button">选择商品图片</button>
      <button id="run" class="secondary" type="button" disabled>开始抠图</button>
      <button id="cancel" class="secondary" type="button" disabled>取消</button>
      <button id="download" type="button" disabled>保存透明 PNG</button>
    </div>
    <p id="status" role="status">支持 JPG、PNG 和 WebP，最大 22 MB。</p>
  </section>

  <section class="previews" aria-label="图片预览">
    <figure class="card">
      <figcaption>原图</figcaption>
      <div class="preview">
        <img id="original" alt="选择的商品图片" hidden>
        <p id="original-empty">选择图片后在这里预览</p>
      </div>
    </figure>
    <figure class="card">
      <figcaption>透明背景</figcaption>
      <div class="preview checker">
        <img id="result" alt="抠图结果" hidden>
        <p id="result-empty">抠图结果会显示在这里</p>
      </div>
    </figure>
  </section>
</main>
<script type="module" src="app.mjs"></script>
</body>
</html>
